# Disposable Mattermost plus a fake Microsoft Entra ID and Graph for the plugin E2E suite.
#   npm run server:up    # start and wait until healthy
#   npm run server:down  # stop and wipe all data
#
# Mattermost reaches the fake through the login.microsoftonline.com and
# graph.microsoft.com network aliases, over TLS with a throwaway CA that Go
# trusts through SSL_CERT_FILE. The browser and the tests reach it on
# http://127.0.0.1:8080. SiteURL stays http://localhost:8065, the redirect URI
# the fake (like the real test app) allows.
name: msteams-meetings-plugin-e2e

services:
  certs:
    image: alpine:3.20
    command: sh -c "apk add --no-cache openssl ca-certificates >/dev/null && sh /gen-certs.sh"
    volumes:
      - certs:/certs
      - ./fake-microsoft/gen-certs.sh:/gen-certs.sh:ro

  fake-microsoft:
    image: node:24-alpine
    working_dir: /app
    command: node server.ts
    depends_on:
      certs:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./fake-microsoft:/app:ro
      - certs:/certs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/__control/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      default:
        aliases:
          - login.microsoftonline.com
          - graph.microsoft.com

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mostest
      POSTGRES_DB: mattermost_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  mattermost:
    # Must satisfy plugin.json's min_server_version. Only amd64 images are
    # published; on Apple silicon Docker Desktop runs them under emulation.
    image: ${MM_IMAGE:-mattermost/mattermost-enterprise-edition:12.0}
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
      fake-microsoft:
        condition: service_healthy
    ports:
      - "127.0.0.1:8065:8065"
    volumes:
      - certs:/certs:ro
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:mostest@postgres:5432/mattermost_test?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      MM_SERVICESETTINGS_ENABLEONBOARDINGFLOW: "false"
      MM_SERVICESETTINGS_ENABLETUTORIAL: "false"
      MM_SERVICESETTINGS_ENABLESECURITYFIXALERT: "false"
      MM_PLUGINSETTINGS_ENABLE: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
      MM_PLUGINSETTINGS_AUTOMATICPREPACKAGEDPLUGINS: "false"
      MM_RATELIMITSETTINGS_ENABLE: "false"
      MM_ANNOUNCEMENTSETTINGS_ADMINNOTICESENABLED: "false"
      MM_ANNOUNCEMENTSETTINGS_USERNOTICESENABLED: "false"
      MM_LOGSETTINGS_CONSOLELEVEL: INFO
      # Go reads this on Linux, so the plugin trusts the fake's certificate.
      SSL_CERT_FILE: /certs/ca-bundle.crt
      # The image is distroless (no shell/curl), so the healthcheck pings the
      # server through mmctl over the local-mode socket.
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
    healthcheck:
      test: ["CMD", "/mattermost/bin/mmctl", "--local", "system", "status"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s

volumes:
  certs: {}
